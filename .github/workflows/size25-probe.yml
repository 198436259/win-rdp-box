name: size25-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 25GB OSS transfer probe
        shell: powershell
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not $env:OSS_BUCKET) { throw "OSS_BUCKET missing" }
          $size = [int64]25GB
          $dir = "D:\size25"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $blob = Join-Path $dir "blob25.bin"
          Write-Host "creating 25GB file"
          $t0 = Get-Date
          $fs = [IO.File]::Open($blob, "Create", "Write", "None")
          $fs.SetLength($size)
          $buf = New-Object byte[] (8MB)
          $rnd = [Random]::new()
          $rnd.NextBytes($buf)
          $written = [int64]0
          while ($written -lt $size) {
            $remain = $size - $written
            $n = if ($remain -lt $buf.Length) { [int]$remain } else { $buf.Length }
            $fs.Write($buf, 0, $n)
            $written += $n
          }
          $fs.Close()
          $createSec = ((Get-Date) - $t0).TotalSeconds
          Write-Host ("created bytes={0} seconds={1:N1}" -f (Get-Item $blob).Length, $createSec)

          $rcloneDir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $rcloneDir -Force
          $exe = Get-ChildItem $rcloneDir -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_OSS_TYPE = "s3"
          $env:RCLONE_CONFIG_OSS_PROVIDER = "Alibaba"
          $env:RCLONE_CONFIG_OSS_ACCESS_KEY_ID = $env:OSS_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY = $env:OSS_ACCESS_KEY_SECRET
          $env:RCLONE_CONFIG_OSS_ENDPOINT = $env:OSS_ENDPOINT
          $remote = "oss:$($env:OSS_BUCKET)/size25-probe/"

          function Invoke-RcloneCopy {
            param([string[]]$RcloneArgs)
            $out = & $exe @RcloneArgs 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "rclone exit=$code" }
          }

          Write-Host "UPLOAD start"
          $t1 = Get-Date
          Invoke-RcloneCopy @("copy", $blob, $remote, "--progress", "--local-no-sparse")
          $upSec = ((Get-Date) - $t1).TotalSeconds
          $mb = $size / 1MB
          Write-Host ("UPLOAD_OK seconds={0:N1} MiB/s={1:N1}" -f $upSec, ($mb / $upSec))

          Remove-Item $blob -Force
          Write-Host "DOWNLOAD start"
          $t2 = Get-Date
          Invoke-RcloneCopy @("copy", ($remote + "blob25.bin"), $dir, "--progress", "--local-no-sparse")
          $downSec = ((Get-Date) - $t2).TotalSeconds
          Write-Host ("DOWNLOAD_OK bytes={0} seconds={1:N1} MiB/s={2:N1}" -f (Get-Item $blob).Length, $downSec, ($mb / $downSec))

          Write-Host "cleanup remote probe object"
          & $exe deletefile ($remote + "blob25.bin") 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host ("SUMMARY create={0:N1}s upload={1:N1}s download={2:N1}s" -f $createSec, $upSec, $downSec)
