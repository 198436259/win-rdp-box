name: r2-see-it
on: workflow_dispatch
jobs:
  see:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_E_PREFIX: verify2
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      RDP_PASS: ${{ secrets.RDP_PASS }}
      SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
      SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: enable rdp
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $pw = $env:RDP_PASS
          if (-not $pw) { $pw = "Runner123" }
          net user runneradmin $pw 2>&1 | Out-Host
          net localgroup administrators runneradmin /add 2>&1 | Out-Host
          net localgroup "Remote Desktop Users" runneradmin /add 2>&1 | Out-Host
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          Write-Host "rdp enabled"

      - name: start ngrok and publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "ngrok"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ngrok.zip"
          curl.exe -fsSL -o $zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          $ngrok = Join-Path $dir "ngrok.exe"
          & $ngrok config add-authtoken $env:NGROK_AUTHTOKEN | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "ngrok.log"
          Start-Process -FilePath $ngrok -ArgumentList @("tcp","3389","--region","jp","--log",$log) -WindowStyle Hidden
          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "url=(tcp://[^ ]+)" | Select-Object -Last 1
              if ($m) { $url = $m.Matches[0].Groups[1].Value; break }
            }
          }
          if (-not $url) { throw "ngrok url not found" }
          $port = ($url -split ":")[-1]
          $hostName = ($url -replace "^tcp://","" -split ":")[0]
          Write-Host ("CONNECT host={0} port={1}" -f $hostName, $port)
          $body = "host=$hostName`nport=$port`npass=$env:RDP_PASS`n"
          $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          $pf = Join-Path $env:RUNNER_TEMP "pub.json"
          $json1 = (@{ message = "see-it $($env:GITHUB_RUN_ID)"; content = $b } | ConvertTo-Json -Compress)
          [IO.File]::WriteAllText($pf, $json1, (New-Object Text.UTF8Encoding($false)))
          & curl.exe -sS -o NUL -w "publish http=%{http_code}`n" -X PUT `
            -H "Authorization: Bearer $($env:SNAPSHOT_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            --data-binary "@$pf" `
            "https://api.github.com/repos/$($env:SNAPSHOT_REPO)/contents/.box/see-it-$($env:GITHUB_RUN_ID).txt"

      - name: mount E and restore apps
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = Join-Path $env:RUNNER_TEMP "mount-trace.log"
          Start-Transcript -Path $log -Force | Out-Null
          $t = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
          Write-Host ("RESULT e_present={0} seconds={1:N1}" -f (Test-Path "E:\"), ((Get-Date) - $t).TotalSeconds)
          if (Test-Path "E:\") {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action restore *>&1 | Out-Host
            $i = Get-Item "C:\Program Files\a-Zip" -Force -ErrorAction SilentlyContinue
            Write-Host ("RESULT junction_type={0}" -f ($(if ($i) { $i.LinkType } else { "gone" })))
            Write-Host ("RESULT app_exe_present={0}" -f (Test-Path "C:\Program Files\a-Zip\az.exe"))
          }
          Stop-Transcript | Out-Null
          $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($txt.Length -gt 20000) { $txt = $txt.Substring($txt.Length - 20000) }
          $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($txt))
          $pf = Join-Path $env:RUNNER_TEMP "trace.json"
          $json = (@{ message = "see-it trace"; content = $b } | ConvertTo-Json -Compress)
          [IO.File]::WriteAllText($pf, $json, (New-Object Text.UTF8Encoding($false)))
          & curl.exe -sS -o NUL -w "trace http=%{http_code}`n" -X PUT `
            -H "Authorization: Bearer $($env:SNAPSHOT_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            --data-binary "@$pf" `
            "https://api.github.com/repos/$($env:SNAPSHOT_REPO)/contents/.box/see-trace-$($env:GITHUB_RUN_ID).txt"
          "Look at E:\ and C:\Program Files\a-Zip." | Set-Content -Path "$env:USERPROFILE\Desktop\LOOK-HERE.txt" -Encoding UTF8
          Write-Host "=== NOW LOG IN VIA RDP ==="
          Write-Host "Holding 100 minutes..."
          Start-Sleep -Seconds 6000
          Write-Host "SEE_IT_DONE"
          exit 0
