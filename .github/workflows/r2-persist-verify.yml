name: r2-persist-verify
on:
  workflow_dispatch:
jobs:
  save_session:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_E_PREFIX: b2-verify
    steps:
      - uses: actions/checkout@v4

      - name: "Machine 1: Build base.vhdx.zst -> Reboot into diff.vhdx -> Install App + C-state + 512MB -> Incremental Save"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function G([string]$n, [double]$s, [double]$mb = 0) {
            $r = if ($s -gt 0 -and $mb -gt 0) { $mb / $s } else { 0 }
            Write-Host ("GAUGE {0} seconds={1:N2} MBps={2:N1}" -f $n, $s, $r)
          }

          # Step 1: Initial boot on empty prefix -> creates fresh 100GB dynamic base.vhdx, writes 1GB baseline data, saves base.vhdx.zst
          Write-Host "=== STEP 1: INITIALIZE BASE.VHDX.ZST ==="
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
          if (-not (Test-Path "E:\")) { throw "E: not mounted on init" }

          $buf = New-Object byte[] (8MB)
          $rnd = [Random]::new(2026)
          $rndPart = New-Object byte[] (3355443)
          $hdr = New-Object byte[] 64
          $rnd.NextBytes($rndPart)
          [Array]::Copy($rndPart, 0, $buf, 0, $rndPart.Length)
          for ($k = $rndPart.Length; $k -lt $buf.Length; $k++) {
            $buf[$k] = [byte](($k * 31 + ($k -shr 8)) -band 0xFF)
          }

          $bf = [IO.File]::Open("E:\base-1gb.dat", "Create", "Write", "None")
          $bw = [long]0
          while ($bw -lt 1GB) {
            $rnd.NextBytes($hdr)
            [Array]::Copy($hdr, 0, $buf, 0, 64)
            $bf.Write($buf, 0, $buf.Length)
            $bw += $buf.Length
          }
          $bf.Close()
          Set-Content -Path "E:\base-marker.txt" -Value "base_ok_2026" -Encoding UTF8

          $tBaseSave = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save *>&1 | Out-Host
          G "init_base_save" ((Get-Date) - $tBaseSave).TotalSeconds 1024

          # Step 2: Simulate normal session boot (mounts base.vhdx.zst + creates diff.vhdx)
          Write-Host "=== STEP 2: SESSION BOOT & USER MODIFICATIONS ==="
          Remove-Item "D:\e-disk\*.vhdx", "D:\e-disk\*.zst" -Force -ErrorAction SilentlyContinue
          $tMount = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
          G "session_e_mount" ((Get-Date) - $tMount).TotalSeconds

          # 2a. Install a real multi-file native binary (7z.exe + 7z.dll) into C:\Program Files\FlexPC7Zip
          $appDir = "C:\Program Files\FlexPC7Zip"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "$appDir\7z.exe" -Force
          Copy-Item "C:\Program Files\7-Zip\7z.dll" "$appDir\7z.dll" -Force
          Set-Content -Path "$appDir\version-marker.txt" -Value "FlexPC-B2-RealExe-20261112" -Encoding UTF8

          # 2b. Create ProgramData, Desktop file, Registry key, and User env var
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\FlexPC7Zip" | Out-Null
          Set-Content -Path "C:\ProgramData\FlexPC7Zip\config.ini" -Value "persisted_programdata=true" -Encoding UTF8
          Set-Content -Path "$env:USERPROFILE\Desktop\flexpc-verify.txt" -Value "desktop_alive=true" -Encoding UTF8
          & reg.exe add "HKCU\Software\Claude" /v "FlexPCVerify" /t REG_SZ /d "reg_alive_2026" /f | Out-Null
          [System.Environment]::SetEnvironmentVariable("FLEXPC_USER_VAR", "env_alive_2026", "User")

          # 2c. Write 512MB new data onto E:
          $tWrite = Get-Date
          $df = [IO.File]::Open("E:\delta512.bin", "Create", "Write", "None")
          $dw = [long]0
          while ($dw -lt 512MB) {
            $rnd.NextBytes($hdr)
            [Array]::Copy($hdr, 0, $buf, 0, 64)
            $df.Write($buf, 0, $buf.Length)
            $dw += $buf.Length
          }
          $df.Close()
          G "write_512mb_local_vhdx" ((Get-Date) - $tWrite).TotalSeconds 512

          # Step 3: Run FULL PRODUCTION SHUTDOWN sequence (apps.ps1 save + c-image.ps1 save + e-disk.ps1 save -> diff.vhdx.zst)
          Write-Host "=== STEP 3: PRODUCTION INCREMENTAL SHUTDOWN SAVE ==="
          $tShut = Get-Date

          $tApps = Get-Date
          Remove-Item Env:APPS_ONLY -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action save *>&1 | Out-Host
          G "shutdown_apps_save" ((Get-Date) - $tApps).TotalSeconds

          $jItem = Get-Item $appDir -Force -ErrorAction SilentlyContinue
          Write-Host ("RESULT app_junction_after_save={0}" -f ($(if ($jItem) { $jItem.LinkType } else { "missing" })))
          $runOut = (& "$appDir\7z.exe" 2>&1 | Out-String)
          Write-Host ("RESULT app_runs_via_junction={0}" -f ($runOut -match "7-Zip"))

          $tC = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action save -TargetDir "E:\CloudVM-C" *>&1 | Out-Host
          G "shutdown_c_save" ((Get-Date) - $tC).TotalSeconds
          Write-Host ("RESULT c_delta_tar_exists={0}" -f (Test-Path "E:\CloudVM-C\c-delta.tar"))

          $tE = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save *>&1 | Out-Host
          G "shutdown_e_diff_save" ((Get-Date) - $tE).TotalSeconds 512

          G "shutdown_total" ((Get-Date) - $tShut).TotalSeconds 512
          Write-Host ("RESULT e_unmounted={0}" -f (-not (Test-Path "E:\")))
          Write-Host "MACHINE_1_SAVE_DONE"

  restore_on_fresh_machine:
    needs: save_session
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_E_PREFIX: b2-verify
    steps:
      - uses: actions/checkout@v4

      - name: "Machine 2 (Fresh Runner): Restore base.vhdx.zst + diff.vhdx.zst + apps + C-state & verify all 7 dimensions"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function G([string]$n, [double]$s, [double]$mb = 0) {
            $r = if ($s -gt 0 -and $mb -gt 0) { $mb / $s } else { 0 }
            Write-Host ("GAUGE {0} seconds={1:N2} MBps={2:N1}" -f $n, $s, $r)
          }

          $appDir = "C:\Program Files\FlexPC7Zip"
          Write-Host ("RESULT pre_boot_app_exists={0}" -f (Test-Path $appDir))
          Write-Host ("RESULT pre_boot_pd_exists={0}" -f (Test-Path "C:\ProgramData\FlexPC7Zip\config.ini"))

          $tTotalBoot = Get-Date

          $tMount = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
          G "boot_e_mount" ((Get-Date) - $tMount).TotalSeconds

          $tApps = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action restore *>&1 | Out-Host
          G "boot_apps_restore" ((Get-Date) - $tApps).TotalSeconds

          $tC = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action restore -TargetDir "E:\CloudVM-C" *>&1 | Out-Host
          G "boot_c_restore" ((Get-Date) - $tC).TotalSeconds

          G "boot_persist_ready_total" ((Get-Date) - $tTotalBoot).TotalSeconds

          # Verify all 7 dimensions on the fresh machine
          $baseFile = Get-Item "E:\base-1gb.dat" -ErrorAction SilentlyContinue
          $deltaFile = Get-Item "E:\delta512.bin" -ErrorAction SilentlyContinue
          Write-Host ("RESULT e_base1gb_exact={0}" -f ($(if ($baseFile) { $baseFile.Length -eq 1GB } else { $false })))
          Write-Host ("RESULT e_delta512_exact={0}" -f ($(if ($deltaFile) { $deltaFile.Length -eq 512MB } else { $false })))

          $jItem = Get-Item $appDir -Force -ErrorAction SilentlyContinue
          Write-Host ("RESULT restored_junction_type={0}" -f ($(if ($jItem) { $jItem.LinkType } else { "missing" })))
          $tExe = Get-Date
          $exeOut = (& "$appDir\7z.exe" 2>&1 | Out-String)
          G "cold_launch_restored_exe" ((Get-Date) - $tExe).TotalSeconds
          Write-Host ("RESULT restored_exe_runs={0}" -f ($exeOut -match "7-Zip"))
          $marker = Get-Content "$appDir\version-marker.txt" -Raw -ErrorAction SilentlyContinue
          Write-Host ("RESULT restored_exe_marker={0}" -f ($marker -match "FlexPC-B2-RealExe-20261112"))

          $pdVal = Get-Content "C:\ProgramData\FlexPC7Zip\config.ini" -Raw -ErrorAction SilentlyContinue
          Write-Host ("RESULT restored_programdata={0}" -f ($pdVal -match "persisted_programdata=true"))

          $deskVal = Get-Content "$env:USERPROFILE\Desktop\flexpc-verify.txt" -Raw -ErrorAction SilentlyContinue
          Write-Host ("RESULT restored_desktop={0}" -f ($deskVal -match "desktop_alive=true"))

          $regVal = (& reg.exe query "HKCU\Software\Claude" /v "FlexPCVerify" 2>$null | Out-String)
          Write-Host ("RESULT restored_registry={0}" -f ($regVal -match "reg_alive_2026"))

          $envVal = [System.Environment]::GetEnvironmentVariable("FLEXPC_USER_VAR", "User")
          Write-Host ("RESULT restored_user_env={0}" -f ($envVal -eq "env_alive_2026"))

          Dismount-DiskImage -ImagePath "D:\e-disk\diff.vhdx" -ErrorAction SilentlyContinue | Out-Null
          $rclone = (Get-ChildItem "D:\e-disk\rclone" -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          $ErrorActionPreference = "Continue"
          & $rclone purge "r2:$($env:R2_BUCKET)/b2-verify" 2>&1 | Out-Null

          # Also pre-build base.vhdx.zst at bucket root from user's real e.vhdx so next win-rdp boot uses B2 immediately
          Remove-Item Env:R2_E_PREFIX -ErrorAction SilentlyContinue
          Remove-Item "D:\e-disk\*.vhdx", "D:\e-disk\*.zst", "D:\e-disk\*.flag" -Force -ErrorAction SilentlyContinue
          $rootFiles = @(& $rclone lsf "r2:$($env:R2_BUCKET)" --max-depth 1 2>&1)
          if (($rootFiles -contains "e.vhdx") -and (-not ($rootFiles -contains "base.vhdx.zst"))) {
            Write-Host "=== PRE-MIGRATING ROOT e.vhdx TO base.vhdx.zst FOR PRODUCTION ==="
            $tMig = Get-Date
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save *>&1 | Out-Host
            G "prod_root_evhdx_to_base_zst_migration" ((Get-Date) - $tMig).TotalSeconds
          }

          Write-Host "MACHINE_2_RESTORE_VERIFY_DONE"
          exit 0
