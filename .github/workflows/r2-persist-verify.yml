name: r2-persist-verify
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "save = install app then persist to r2; restore = fresh machine, verify app came back"
        required: true
        default: save
        type: choice
        options: [save, restore]
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_E_PREFIX: verify2
    steps:
      - uses: actions/checkout@v4

      - name: "mount E"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $t = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 | Out-Host
          Write-Host ("GAUGE e_mount seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          Write-Host ("RESULT e_present={0}" -f (Test-Path "E:\"))
          if (Test-Path "E:\") {
            Write-Host ("RESULT e_top=" + ((Get-ChildItem "E:\" | Select-Object -ExpandProperty Name) -join ","))
          }
          exit 0

      - name: "save: install app then persist"
        if: inputs.mode == 'save'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "C:\Program Files\FlexPCProbe" | Out-Null
          Set-Content -Path "C:\Program Files\FlexPCProbe\probe.ps1" -Value "Write-Output FLEXPC_PROBE_OK" -Encoding UTF8
          Write-Host ("RESULT probe_installed={0}" -f (Test-Path "C:\Program Files\FlexPCProbe\probe.ps1"))
          $o = & powershell -NoProfile -File "C:\Program Files\FlexPCProbe\probe.ps1" 2>&1
          Write-Host ("RESULT probe_runs_local={0}" -f (($o -join "") -like "*FLEXPC_PROBE_OK*"))

          Write-Host "--- apps save (upload + junction) ---"
          $t = Get-Date
          $env:APPS_ONLY = "FlexPCProbe"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action save *>&1 | Out-Host
          Write-Host ("GAUGE apps_save seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)
          $i = Get-Item "C:\Program Files\FlexPCProbe" -Force -ErrorAction SilentlyContinue
          Write-Host ("RESULT junction_type={0}" -f ($(if ($i) { $i.LinkType } else { "gone" })))
          Write-Host ("RESULT probe_present_after_junction={0}" -f (Test-Path "C:\Program Files\FlexPCProbe\probe.ps1"))
          $o2 = & powershell -NoProfile -File "C:\Program Files\FlexPCProbe\probe.ps1" 2>&1
          Write-Host ("RESULT probe_runs_after_junction={0}" -f (($o2 -join "") -like "*FLEXPC_PROBE_OK*"))

          Write-Host "--- e-disk save (flush) ---"
          $t = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save *>&1 | Out-Host
          Write-Host ("GAUGE e_flush seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)
          Write-Host "SAVE_ROUND_DONE"
          exit 0

      - name: "restore: verify app came back on a fresh machine"
        if: inputs.mode == 'restore'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host ("RESULT probe_before_restore={0}" -f (Test-Path "C:\Program Files\FlexPCProbe\probe.ps1"))

          Write-Host "--- apps restore (rebuild junctions) ---"
          $t = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action restore *>&1 | Out-Host
          Write-Host ("GAUGE apps_restore seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)

          $i = Get-Item "C:\Program Files\FlexPCProbe" -Force -ErrorAction SilentlyContinue
          Write-Host ("RESULT junction_type={0}" -f ($(if ($i) { $i.LinkType } else { "gone" })))
          Write-Host ("RESULT probe_present_after_boot={0}" -f (Test-Path "C:\Program Files\FlexPCProbe\probe.ps1"))

          $t = Get-Date
          $o = & powershell -NoProfile -File "C:\Program Files\FlexPCProbe\probe.ps1" 2>&1
          Write-Host ("GAUGE cold_run seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          $o | ForEach-Object { Write-Host ("OUT " + [string]$_) }
          Write-Host ("RESULT probe_runs_after_boot={0}" -f (($o -join "") -like "*FLEXPC_PROBE_OK*"))
          Write-Host "RESTORE_ROUND_DONE"
          exit 0
