name: win-rdp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  box:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: enable rdp
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $ErrorActionPreference = "Stop"
          $pw = $env:RDP_PASS
          if (-not $pw) { $pw = "Runner123" }
          net user runneradmin $pw
          if ($LASTEXITCODE -ne 0) { throw "net user failed: $LASTEXITCODE" }
          net localgroup administrators runneradmin /add
          net localgroup "Remote Desktop Users" runneradmin /add
          "RDP_PASS=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "rdp password set"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force | Out-Null
          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          Set-ItemProperty -Path $tsPol -Name "UserAuthentication" -Value 0 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "fEnableWinStation" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "AVC444ModePreferred" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "AVCHardwareEncodePreferred" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "ColorDepth" -Value 5 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "MaxCompressionLevel" -Value 2 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "VisualExperiencePolicy" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "SelectTransport" -Value 0 -Type DWord
          Set-ItemProperty -Path $tsPol -Name "fServerEnableRDP8" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations" -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389-TCP-in" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "RDP-3389-UDP-in" -Direction Inbound -Protocol UDP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          netstat -an | findstr ":3389"
          Write-Host "rdp enabled nla=off 60fps=on avc444=on tcp+udp=3389"

      - name: start ngrok tcp 3389
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:NGROK_AUTHTOKEN) { throw "NGROK_AUTHTOKEN secret missing" }
          $zip = Join-Path $env:RUNNER_TEMP "ngrok.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ngrok"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe -fsSL -o $zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          if (-not (Test-Path $zip) -or ((Get-Item $zip).Length -lt 1000000)) { throw "ngrok zip download failed" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $ngrok = Join-Path $dir "ngrok.exe"
          & $ngrok config add-authtoken $env:NGROK_AUTHTOKEN
          $log = Join-Path $env:RUNNER_TEMP "ngrok.log"
          Start-Process -FilePath $ngrok -ArgumentList @("tcp","3389","--region","jp","--log",$log) -WindowStyle Hidden
          Write-Host "ngrok started in background"

      - name: publish connect info
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SNAPSHOT_REPO) { $env:SNAPSHOT_REPO = $env:GITHUB_REPOSITORY }
          $pub = $null
          $log = Join-Path $env:RUNNER_TEMP "ngrok.log"
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $j = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
              foreach ($t in @($j.tunnels)) {
                $u = [string]$t.public_url
                if ($u -match "^tcp://") { $pub = $u; break }
              }
            } catch {}
            if ($pub) { break }
            Start-Sleep -Seconds 3
          }
          $status = "ready"
          $rdpHost = ""
          $rdpPort = ""
          if (-not $pub) {
            $status = "ngrok-no-url"
            if (Test-Path $log) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -First 40 }
          } elseif ($pub -match "tcp://([^:]+):(\d+)") {
            $rdpHost = $Matches[1]
            $rdpPort = $Matches[2]
          } else {
            $status = "ngrok-bad-url"
          }
          Write-Host "tunnel status=$status host=$rdpHost port=$rdpPort"
          $body = "status=$status`nhost=$rdpHost`nport=$rdpPort`npass=$env:RDP_PASS`nurl=$pub`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          $path = ".box/$($env:GITHUB_RUN_ID).txt"
          $payload = (@{ message = "box $($env:GITHUB_RUN_ID)"; content = $b64 } | ConvertTo-Json -Compress)
          $payloadFile = Join-Path $env:RUNNER_TEMP "box.json"
          [IO.File]::WriteAllText($payloadFile, $payload)
          if ($env:GITHUB_TOKEN) {
            $httpCode = & curl.exe -sS -o "$env:RUNNER_TEMP\box-resp.txt" -w "%{http_code}" -X PUT `
              -H "Authorization: Bearer $($env:GITHUB_TOKEN)" `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              -H "Content-Type: application/json" `
              --data-binary "@$payloadFile" `
              "https://api.github.com/repos/$($env:SNAPSHOT_REPO)/contents/$path"
            Write-Host "report http=$httpCode repo=$($env:SNAPSHOT_REPO)"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/health" -Content "c=pending`ne=pending`n"
          "Loading persist disk E and user state. Wait for E-READY.txt on Desktop." | Set-Content -Path "$env:USERPROFILE\Desktop\LOADING-E.txt" -Encoding ASCII
          if ($status -ne "ready") { throw "tunnel not ready: $status" }

      - name: mount E and restore C
        continue-on-error: true
        shell: powershell
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not $env:SNAPSHOT_REPO) { $env:SNAPSHOT_REPO = $env:GITHUB_REPOSITORY }
          $e = "fail"
          $c = "fail"
          $mountLog = Join-Path $env:RUNNER_TEMP "e-mount.log"
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action mount *>&1 |
              Tee-Object -FilePath $mountLog
            if (Test-Path "E:\") { $e = "ok" }
          } catch {
            Write-Host "mount E failed: $_"
            $_ | Out-File -FilePath $mountLog -Append -Encoding utf8
          }
          if (Test-Path $mountLog) {
            $logText = Get-Content $mountLog -Raw -ErrorAction SilentlyContinue
            if ($logText.Length -gt 15000) { $logText = $logText.Substring($logText.Length - 15000) }
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/e-mount.log" -Content $logText
          }
          if (Test-Path "E:\") {
            try {
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action restore *>&1 | Out-Host
            } catch {
              Write-Host "apps restore failed: $_"
            }
          }
          $delta = "E:\CloudVM-C"
          try {
            if ((Test-Path $delta) -and (Test-Path "$delta\manifest.json")) {
              try {
                $manObj = Get-Content "$delta\manifest.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
                if ($manObj -and $manObj.system -and ([int]$manObj.system.files -lt 50)) {
                  Write-Host "CloudVM-C has $($manObj.system.files) files, restoring base release zip first"
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action restore
                }
              } catch {}
              Write-Host "restore C from E:\\CloudVM-C"
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action restore -TargetDir $delta
            } else {
              Write-Host "no E:\\CloudVM-C, restore C from release zip"
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action restore
            }
            $c = "ok"
          } catch {
            Write-Host "restore C failed: $_"
          }
          $src = "$env:USERPROFILE\win-rdp-src"
          New-Item -ItemType Directory -Force -Path "$src\scripts" | Out-Null
          Copy-Item -Recurse -Force .\scripts\* "$src\scripts"
          @{
            GITHUB_TOKEN      = $env:GITHUB_TOKEN
            GITHUB_REPOSITORY = $env:SNAPSHOT_REPO
            SNAPSHOT_REPO     = $env:SNAPSHOT_REPO
          } | ConvertTo-Json | Set-Content -Path "$src\env.json" -Encoding UTF8
          icacls "$src\env.json" /inheritance:r /grant:r "${env:USERNAME}:(R,W)" | Out-Null
          Copy-Item -Force "$src\scripts\save-desktop.ps1" "$env:USERPROFILE\Desktop\save-image.ps1"
          Copy-Item -Force "$src\scripts\C-IMAGE.txt" "$env:USERPROFILE\Desktop\c-image.txt"
          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut("$env:USERPROFILE\Desktop\save-image.lnk")
          $sc.TargetPath = "powershell.exe"
          $sc.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$env:USERPROFILE\Desktop\save-image.ps1`""
          $sc.WorkingDirectory = $src
          $sc.WindowStyle = 1
          $sc.Save()
          Write-Host "desktop save shortcut created"
          $health = "c=$c`ne=$e`n"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/health" -Content $health
          Write-Host "health c=$c e=$e"
          Remove-Item "$env:USERPROFILE\Desktop\LOADING-E.txt" -ErrorAction SilentlyContinue
          "c=$c e=$e $(Get-Date -Format o)" | Set-Content -Path "$env:USERPROFILE\Desktop\E-READY.txt" -Encoding UTF8

      - name: keep alive
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not $env:SNAPSHOT_REPO) { $env:SNAPSHOT_REPO = $env:GITHUB_REPOSITORY }
          Write-Host "keepalive start"
          $deadline = (Get-Date).AddMinutes(350)
          $nextSave = (Get-Date).AddMinutes(60)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $cmdText = ""
            try {
              $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action get -RelPath ".box/cmd" 2>&1 |
                Where-Object { $_ -isnot [System.Management.Automation.ErrorRecord] }
              if ($null -ne $out) { $cmdText = ([string]($out | Select-Object -Last 1)).Trim() }
            } catch {
              Write-Host "cmd poll failed: $_"
            }
            if ($cmdText -eq "shutdown") {
              Write-Host "shutdown cmd received"
              try {
                powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action delete -RelPath ".box/cmd"
              } catch {
                Write-Host "delete cmd failed: $_"
              }
              try {
                if (Test-Path "E:\") {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action save *>&1 | Out-Host
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action save -TargetDir "E:\CloudVM-C"
                } else {
                  throw "E: not mounted"
                }
              } catch {
                $msg = "error:c:$_"
                Write-Host $msg
                powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/cmd-result" -Content $msg
                continue
              }
              $result = "ok"
              try {
                powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save
              } catch {
                $result = "error:e:$_"
                Write-Host $result
              }
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/cmd-result" -Content $result
              Write-Host "shutdown sequence done result=$result"
              break
            }
            if ((Get-Date) -ge $nextSave) {
              Write-Host "periodic save $((Get-Date).ToString('o'))"
              try {
                if (Test-Path "E:\") {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action save *>&1 | Out-Host
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action save -TargetDir "E:\CloudVM-C"
                }
              } catch {
                Write-Host "periodic save failed: $_"
              }
              $nextSave = (Get-Date).AddMinutes(60)
            }
          }
          Write-Host "auto-save before timeout"
          try {
            if (Test-Path "E:\") {
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\apps.ps1 -Action save *>&1 | Out-Host
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\c-image.ps1 -Action save -TargetDir "E:\CloudVM-C"
              powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\e-disk.ps1 -Action save
            }
          } catch {
            Write-Host "auto-save failed: $_"
          }
