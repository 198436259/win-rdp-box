name: size25-boot
on: workflow_dispatch
jobs:
  save:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: make 25GB VHD and upload
        shell: powershell
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $vhd = "D:\e25.vhdx"
          if (Test-Path $vhd) { Remove-Item $vhd -Force }
          Write-Host "SAVE_T0=$(Get-Date -Format o)"
          New-VHD -Path $vhd -SizeBytes 30GB -Dynamic | Out-Null
          $img = Mount-DiskImage -ImagePath $vhd -PassThru
          $disk = $img | Get-Disk
          Initialize-Disk -Number $disk.Number -PartitionStyle GPT -PassThru |
            New-Partition -UseMaximumSize -DriveLetter E |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel "persist" -Confirm:$false | Out-Null
          New-Item -ItemType Directory -Force -Path "E:\CloudVM-C" | Out-Null
          "size25 $(Get-Date -Format o)" | Set-Content "E:\probe.txt" -Encoding ASCII
          $blob = "E:\blob25.bin"
          $size = [int64]25GB
          $fs = [IO.File]::Open($blob, "Create", "Write", "None")
          $fs.SetLength($size)
          $buf = New-Object byte[] (8MB)
          $rnd = [Random]::new(); $rnd.NextBytes($buf)
          $written = [int64]0
          while ($written -lt $size) {
            $remain = $size - $written
            $n = if ($remain -lt $buf.Length) { [int]$remain } else { $buf.Length }
            $fs.Write($buf, 0, $n)
            $written += $n
          }
          $fs.Close()
          Write-Host ("filled E blob bytes={0}" -f (Get-Item $blob).Length)
          Dismount-DiskImage -ImagePath $vhd | Out-Null
          Write-Host ("vhd bytes={0}" -f (Get-Item $vhd).Length)
          $rcloneDir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $rcloneDir -Force
          $exe = Get-ChildItem $rcloneDir -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_OSS_TYPE = "s3"
          $env:RCLONE_CONFIG_OSS_PROVIDER = "Alibaba"
          $env:RCLONE_CONFIG_OSS_ACCESS_KEY_ID = $env:OSS_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY = $env:OSS_ACCESS_KEY_SECRET
          $env:RCLONE_CONFIG_OSS_ENDPOINT = $env:OSS_ENDPOINT
          Write-Host "SAVE_UPLOAD_T0=$(Get-Date -Format o)"
          $ErrorActionPreference = "Continue"
          & $exe copy $vhd "oss:$($env:OSS_BUCKET)/size25-boot/" --progress --local-no-sparse 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          Write-Host "SAVE_UPLOAD_T1=$(Get-Date -Format o)"
          Write-Host "SAVE_OK"

  boot:
    needs: save
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: enable rdp
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $ErrorActionPreference = "Stop"
          $pw = $env:RDP_PASS
          if (-not $pw) { $pw = "Runner123" }
          net user runneradmin $pw
          net localgroup administrators runneradmin /add
          net localgroup "Remote Desktop Users" runneradmin /add
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389-in" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Restart-Service TermService -Force
          Write-Host "BOOT_T0=$(Get-Date -Format o)"
      - name: start ngrok
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ngrok.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ngrok"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe -fsSL -o $zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          $ngrok = Join-Path $dir "ngrok.exe"
          & $ngrok config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process -FilePath $ngrok -ArgumentList @("tcp","3389","--region","jp","--log",(Join-Path $env:RUNNER_TEMP "ngrok.log")) -WindowStyle Hidden
          Write-Host "ngrok started"
      - name: publish connect
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SNAPSHOT_REPO) { $env:SNAPSHOT_REPO = $env:GITHUB_REPOSITORY }
          $pub = $null
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $j = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
              foreach ($t in @($j.tunnels)) {
                $u = [string]$t.public_url
                if ($u -match "^tcp://") { $pub = $u; break }
              }
            } catch {}
            if ($pub) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $pub) { throw "ngrok-no-url" }
          Write-Host "CONNECT_READY=$(Get-Date -Format o) url=$pub"
          $body = "status=ready`nhost=$((($pub -split '://')[1] -split ':')[0])`nport=$(($pub -split ':')[-1])`npass=$env:RDP_PASS`nurl=$pub`n"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/size25.txt" -Content $body
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/health-25" -Content "c=pending`ne=pending`n"
          "Loading 25GB persist disk. Wait for E-READY.txt" | Set-Content "$env:USERPROFILE\Desktop\LOADING-E.txt" -Encoding ASCII
      - name: download 25GB VHD and mount E
        shell: powershell
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not $env:SNAPSHOT_REPO) { $env:SNAPSHOT_REPO = $env:GITHUB_REPOSITORY }
          Write-Host "LOAD_T0=$(Get-Date -Format o)"
          $vhd = "D:\e25.vhdx"
          $rcloneDir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $rcloneDir -Force
          $exe = Get-ChildItem $rcloneDir -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_OSS_TYPE = "s3"
          $env:RCLONE_CONFIG_OSS_PROVIDER = "Alibaba"
          $env:RCLONE_CONFIG_OSS_ACCESS_KEY_ID = $env:OSS_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY = $env:OSS_ACCESS_KEY_SECRET
          $env:RCLONE_CONFIG_OSS_ENDPOINT = $env:OSS_ENDPOINT
          Write-Host "DOWNLOAD_T0=$(Get-Date -Format o)"
          & $exe copy "oss:$($env:OSS_BUCKET)/size25-boot/e25.vhdx" "D:\" --progress --local-no-sparse 2>&1 | ForEach-Object { Write-Host $_ }
          if (-not (Test-Path $vhd)) { throw "e25.vhdx missing" }
          Write-Host "DOWNLOAD_T1=$(Get-Date -Format o) bytes=$((Get-Item $vhd).Length)"
          $out = & fsutil.exe sparse queryflag $vhd 2>&1 | Out-String
          Write-Host "sparse=$out"
          if ($out -match "is set") {
            $tmp = "D:\nonsparse-e25.vhdx"
            Write-Host "unsparse copy"
            cmd.exe /c "copy /y `"$vhd`" `"$tmp`""
            Remove-Item $vhd -Force
            Move-Item $tmp $vhd -Force
          }
          Write-Host "MOUNT_T0=$(Get-Date -Format o)"
          Mount-DiskImage -ImagePath $vhd | Out-Null
          Start-Sleep -Seconds 2
          $vol = Get-Volume | Where-Object { $_.FileSystemLabel -eq "persist" } | Select-Object -First 1
          if ($vol -and $vol.DriveLetter -and $vol.DriveLetter -ne "E") {
            Get-Partition -DriveLetter $vol.DriveLetter | Set-Partition -NewDriveLetter E
          }
          if (-not (Test-Path "E:\")) { throw "E: not mounted" }
          Write-Host "MOUNT_T1=$(Get-Date -Format o)"
          Get-Content "E:\probe.txt" -ErrorAction SilentlyContinue
          if (Test-Path "E:\blob25.bin") { Write-Host ("blob bytes={0}" -f (Get-Item "E:\blob25.bin").Length) }
          Remove-Item "$env:USERPROFILE\Desktop\LOADING-E.txt" -ErrorAction SilentlyContinue
          "e=ok $(Get-Date -Format o)" | Set-Content "$env:USERPROFILE\Desktop\E-READY.txt" -Encoding ASCII
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\box-mail.ps1 -Action put -RelPath ".box/health-25" -Content "c=ok`ne=ok`n"
          Write-Host "LOAD_OK"
      - name: keep alive
        shell: powershell
        run: |
          Write-Host "keepalive 8 min for inspect"
          Start-Sleep -Seconds 480
