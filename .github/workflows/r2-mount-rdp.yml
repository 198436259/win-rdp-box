name: r2-mount-rdp
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      RDP_PASS: ${{ secrets.RDP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: enable rdp
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $pw = $env:RDP_PASS
          if (-not $pw) { $pw = "Runner123" }
          net user runneradmin $pw 2>&1 | Out-Host
          net localgroup administrators runneradmin /add 2>&1 | Out-Host
          net localgroup "Remote Desktop Users" runneradmin /add 2>&1 | Out-Host
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          Write-Host "rdp enabled"

      - name: start ngrok
        shell: powershell
        env:
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "ngrok"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ngrok.zip"
          curl.exe -fsSL -o $zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          $ngrok = Join-Path $dir "ngrok.exe"
          & $ngrok config add-authtoken $env:NGROK_AUTHTOKEN | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "ngrok.log"
          Start-Process -FilePath $ngrok -ArgumentList @("tcp","3389","--region","jp","--log",$log) -WindowStyle Hidden
          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "url=(tcp://[^ ]+)" | Select-Object -Last 1
              if ($m) { $url = $m.Matches[0].Groups[1].Value; break }
            }
          }
          if (-not $url) { Write-Host "ngrok url not found"; exit 1 }
          $port = ($url -split ":")[-1]
          $hostName = ($url -replace "^tcp://","" -split ":")[0]
          Write-Host ("CONNECT host={0} port={1} pass={2}" -f $hostName, $port, $env:RDP_PASS)
          "PROBE_HOST=$hostName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $body = "host=$hostName`nport=$port`npass=$env:RDP_PASS`n"
          $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          $pf = Join-Path $env:RUNNER_TEMP "pub.json"
          $json1 = (@{ message = "mount probe $($env:GITHUB_RUN_ID)"; content = $b } | ConvertTo-Json -Compress)
          [IO.File]::WriteAllText($pf, $json1, (New-Object Text.UTF8Encoding($false)))
          $code = & curl.exe -sS -o NUL -w "%{http_code}" -X PUT `
            -H "Authorization: Bearer $($env:SNAPSHOT_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            --data-binary "@$pf" `
            "https://api.github.com/repos/$($env:SNAPSHOT_REPO)/contents/.box/mount-probe-$($env:GITHUB_RUN_ID).txt"
          Write-Host "publish http=$code"

      - name: install winfsp and mount R2 as E
        shell: powershell
        env:
          SNAPSHOT_REPO: ${{ secrets.SNAPSHOT_REPO }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          curl.exe -fsSL -o $msi "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          Write-Host ("winfsp exit={0}" -f $p.ExitCode)

          $dir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName

          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"

          $log = "D:\mount.log"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "mount", "r2:$($env:R2_BUCKET)/", "E:",
            "--vfs-cache-mode", "full",
            "--dir-cache-time", "10s",
            "--log-file", $log,
            "--log-level", "INFO"
          ) -PassThru -WindowStyle Hidden
          Write-Host ("mount pid={0}" -f $proc.Id)
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path "E:\") { break }
          }
          Write-Host ("SESSION0 drive_appeared={0}" -f (Test-Path "E:\"))
          if (Test-Path "E:\") {
            Get-ChildItem "E:\" | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          }

          $res = "session0_drive={0}" -f (Test-Path "E:\")
          $rb = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($res + "`n"))
          $rf = Join-Path $env:RUNNER_TEMP "res.json"
          $json2 = (@{ message = "mount probe result"; content = $rb } | ConvertTo-Json -Compress)
          [IO.File]::WriteAllText($rf, $json2, (New-Object Text.UTF8Encoding($false)))
          $rc = & curl.exe -sS -o NUL -w "%{http_code}" -X PUT `
            -H "Authorization: Bearer $($env:SNAPSHOT_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            --data-binary "@$rf" `
            "https://api.github.com/repos/$($env:SNAPSHOT_REPO)/contents/.box/mount-result-$($env:GITHUB_RUN_ID).txt"
          Write-Host "result publish http=$rc"

          Write-Host "=== RDP SESSION CHECK ==="
          Write-Host "Log into RDP with the credentials above, then run in that session:"
          Write-Host "  Get-PSDrive E; Test-Path E:\; Get-ChildItem E:\"
          Write-Host "Holding for 20 minutes..."
          Start-Sleep -Seconds 1200
          Write-Host "PROBE_DONE"
