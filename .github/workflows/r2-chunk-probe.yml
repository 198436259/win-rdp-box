name: r2-chunk-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: count multipart parts from HTTP headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          Write-Host ("rclone {0}" -f (& $exe version | Select-Object -First 1))

          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"

          $root = if (Test-Path "D:\") { "D:\chunkprobe" } else { Join-Path $env:RUNNER_TEMP "chunkprobe" }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $f = Join-Path $root "blob.bin"
          $target = [long](3.44GB)
          $buf = New-Object byte[] (8MB)
          [Random]::new(11).NextBytes($buf)
          $fs = [IO.File]::Open($f, "Create", "Write", "None")
          try {
            $w = [long]0
            while ($w -lt $target) {
              $c = [int][Math]::Min([long]$buf.Length, ($target - $w))
              $fs.Write($buf, 0, $c)
              $w += $c
            }
          } finally { $fs.Close() }
          $bytes = [long](Get-Item $f).Length
          Write-Host ("blob bytes={0}" -f $bytes)
          Write-Host ("expected parts at 5MiB={0} at 64MiB={1}" -f [Math]::Ceiling($bytes / 5MB), [Math]::Ceiling($bytes / 64MB))

          function Measure-Upload([string]$label, [string]$prefix, [string[]]$extra) {
            $log = Join-Path $root ("$label.log")
            $args = @("copy", $f, "r2:$($env:R2_BUCKET)/$prefix", "--dump", "headers") + $extra
            $t0 = Get-Date
            $old = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & $exe @args *> $log
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            if ($code -ne 0) { throw "$label upload failed exit=$code" }
            $sec = ((Get-Date) - $t0).TotalSeconds
            $parts = (Select-String -Path $log -Pattern "partNumber=" -AllMatches).Matches.Count
            $puts = (Select-String -Path $log -Pattern "> PUT ").Count
            Write-Host ("GAUGE {0} seconds={1:N1} MBps={2:N1}" -f $label, $sec, (($bytes / 1MB) / $sec))
            Write-Host ("RESULT {0} part_requests={1} put_requests={2}" -f $label, $parts, $puts)
          }

          Measure-Upload "default5" "chunk-probe/d5/" @()
          Measure-Upload "chunk64" "chunk-probe/c64/" @("--s3-chunk-size", "64M")
          Measure-Upload "chunk64b" "chunk-probe/c64b/" @("--s3-chunk-size", "64M")

          foreach ($prefix in "chunk-probe/d5/", "chunk-probe/c64/", "chunk-probe/c64b/", "chunk-probe64/", "chunk-probe5/") {
            $old = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & $exe delete "r2:$($env:R2_BUCKET)/$prefix" 2>&1 | Out-Host
            $ErrorActionPreference = $old
          }

          Write-Host "CHUNK_PROBE_DONE"
