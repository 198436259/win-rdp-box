name: r2-apps-junction
on: workflow_dispatch
jobs:
  j:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: "1 install winfsp rclone and 7zip"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          curl.exe -fsSL -o $msi "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          Write-Host ("RESULT winfsp_exit={0}" -f $p.ExitCode)
          $dir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          & choco install 7zip -y --no-progress 2>&1 | Out-Null
          Write-Host ("RESULT sevenzip_installed={0}" -f (Test-Path "C:\Program Files\7-Zip\7z.exe"))
          $out = & "C:\Program Files\7-Zip\7z.exe" 2>&1 | Select-Object -First 2
          Write-Host ("RESULT local_exec_baseline={0}" -f (@($out | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0))

      - name: "2 copy to r2 then mount WITHOUT file-perms and test exec"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rclone") -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"

          $t = Get-Date
          & $exe copy "C:\Program Files\7-Zip" "r2:$($env:R2_BUCKET)/apps/ProgramFiles/7-Zip" --transfers 16 --checkers 32 --s3-chunk-size 64M 2>$null | Out-Null
          Write-Host ("RESULT upload_exit={0}" -f $LASTEXITCODE)
          Write-Host ("GAUGE app_upload seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)

          $cache = Join-Path $env:RUNNER_TEMP "vfscache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $logA = Join-Path $env:RUNNER_TEMP "mountA.log"
          $procA = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -ArgumentList @(
            "mount", "r2:$($env:R2_BUCKET)/apps", "E:",
            "--vfs-cache-mode", "full", "--cache-dir", $cache,
            "--links", "--dir-cache-time", "10s", "--transfers", "16",
            "--log-file", $logA, "--log-level", "INFO"
          )
          for ($i = 0; $i -lt 240; $i++) { Start-Sleep -Milliseconds 250; if (Test-Path "E:\") { break } }
          Write-Host ("RESULT mountA_up={0}" -f (Test-Path "E:\"))

          $directA = "E:\ProgramFiles\7-Zip\7z.exe"
          Write-Host ("RESULT A_exe_present={0}" -f (Test-Path $directA))
          $o = & $directA 2>&1 | Select-Object -First 3
          $okA = @($o | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0
          Write-Host ("RESULT A_direct_exec_no_perms={0}" -f $okA)
          $o | ForEach-Object { Write-Host ("A_OUT " + [string]$_) }

          $linkA = "C:\Program Files\7-Zip"
          Remove-Item $linkA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Junction -Path $linkA -Target "E:\ProgramFiles\7-Zip" -Force | Out-Null
          $o2 = & $linkA"\7z.exe" 2>&1 | Select-Object -First 3
          $okA2 = @($o2 | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0
          Write-Host ("RESULT A_junction_exec_no_perms={0}" -f $okA2)

          Get-Process rclone -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          & cmd.exe /c "rmdir E:" 2>$null | Out-Null
          Write-Host ("RESULT mountA_down={0}" -f (-not (Test-Path "E:\")))

      - name: "3 mount WITH file-perms 0777 and test exec"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rclone") -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"

          $cache = Join-Path $env:RUNNER_TEMP "vfscache"
          $logB = Join-Path $env:RUNNER_TEMP "mountB.log"
          $t = Get-Date
          $procB = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -ArgumentList @(
            "mount", "r2:$($env:R2_BUCKET)/apps", "E:",
            "--vfs-cache-mode", "full", "--cache-dir", $cache,
            "--links", "--dir-cache-time", "10s", "--transfers", "16",
            "--file-perms", "0777", "--dir-perms", "0777",
            "--log-file", $logB, "--log-level", "INFO"
          )
          for ($i = 0; $i -lt 240; $i++) { Start-Sleep -Milliseconds 250; if (Test-Path "E:\") { break } }
          Write-Host ("GAUGE mountB_visible seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          Write-Host ("RESULT mountB_up={0}" -f (Test-Path "E:\"))
          if (-not (Test-Path "E:\")) { Get-Content $logB -Tail 30 -ErrorAction SilentlyContinue | Out-Host; exit 0 }

          $directB = "E:\ProgramFiles\7-Zip\7z.exe"
          Write-Host ("RESULT B_exe_present={0}" -f (Test-Path $directB))
          $o = & $directB 2>&1 | Select-Object -First 3
          $okB = @($o | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0
          Write-Host ("RESULT B_direct_exec_perms0777={0}" -f $okB)
          $o | ForEach-Object { Write-Host ("B_OUT " + [string]$_) }

          $link = "C:\Program Files\7-Zip"
          $j = Get-Item $link -Force -ErrorAction SilentlyContinue
          Write-Host ("RESULT junction_state={0}" -f ($(if ($j) { $j.LinkType } else { "gone" })))
          if (-not (Test-Path $link)) {
            & cmd.exe /c "rmdir `"$link`"" 2>$null | Out-Null
            New-Item -ItemType Junction -Path $link -Target "E:\ProgramFiles\7-Zip" -Force | Out-Null
            Write-Host ("RESULT junction_rebuilt={0}" -f (Test-Path $link))
          }
          $o2 = & $link"\7z.exe" 2>&1 | Select-Object -First 3
          $okB2 = @($o2 | Where-Object { [string]$o2 -like "*7-Zip*" }).Count -gt 0
          Write-Host ("RESULT B_junction_exec_perms0777={0}" -f $okB2)

          $tmp = Join-Path $env:RUNNER_TEMP "jt"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Content (Join-Path $tmp "a.txt") "hello"
          & $link"\7z.exe" a (Join-Path $tmp "a.zip") (Join-Path $tmp "a.txt") 2>&1 | Out-Null
          Write-Host ("RESULT B_zip_via_junction={0}" -f (Test-Path (Join-Path $tmp "a.zip")))

      - name: "4 write through mount and verify in r2"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Set-Content -Path "E:\ProgramFiles\7-Zip\written-by-probe.txt" -Value "probe wrote this" -Encoding UTF8
          Write-Host ("RESULT write_ok={0}" -f (Test-Path "E:\ProgramFiles\7-Zip\written-by-probe.txt"))
          Get-Process rclone -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 10

          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rclone") -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"
          $txt = & $exe cat "r2:$($env:R2_BUCKET)/apps/ProgramFiles/7-Zip/written-by-probe.txt" 2>$null
          Write-Host ("RESULT r2_write_back={0}" -f ((@($txt) -join "") -like "*probe wrote this*"))
          & $exe delete "r2:$($env:R2_BUCKET)/apps/ProgramFiles/7-Zip/written-by-probe.txt" 2>$null | Out-Null
          Write-Host "APPS_JUNCTION_DONE"
