name: r2-apps-junction
on: workflow_dispatch
jobs:
  j:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: "1 install winfsp rclone and 7zip"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          curl.exe -fsSL -o $msi "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          Write-Host ("RESULT winfsp_exit={0}" -f $p.ExitCode)
          $dir = Join-Path $env:RUNNER_TEMP "rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          curl.exe -fsSL -o $zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive $zip $dir -Force
          & choco install 7zip -y --no-progress 2>&1 | Out-Null
          Write-Host ("RESULT sevenzip_installed={0}" -f (Test-Path "C:\Program Files\7-Zip\7z.exe"))
          $sz = 0; $n = 0
          Get-ChildItem "C:\Program Files\7-Zip" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $sz += $_.Length; $n++ }
          Write-Host ("RESULT sevenzip_files={0} bytes={1}" -f $n, $sz)

      - name: "2 upload app folder to r2 and replace with junction"
        shell: powershell
        run: |
          # rclone writes NOTICE to stderr; Stop turns that into a fatal error.
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rclone") -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"

          $src = "C:\Program Files\7-Zip"
          $t = Get-Date
          & $exe copy $src "r2:$($env:R2_BUCKET)/apps/ProgramFiles/7-Zip" --transfers 16 --checkers 32 --s3-chunk-size 64M 2>&1 | Out-Null
          Write-Host ("RESULT upload_exit={0}" -f $LASTEXITCODE)
          Write-Host ("GAUGE app_upload seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)
          $remote = (& $exe lsf "r2:$($env:R2_BUCKET)/apps/ProgramFiles/7-Zip" --recursive 2>&1 | Measure-Object).Count
          Write-Host ("RESULT r2_app_files={0}" -f $remote)

          $t = Get-Date
          Remove-Item $src -Recurse -Force
          Write-Host ("RESULT original_removed={0}" -f (-not (Test-Path $src)))

          $mountLog = Join-Path $env:RUNNER_TEMP "mount.log"
          $cache = Join-Path $env:RUNNER_TEMP "vfscache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -ArgumentList @(
            "mount", "r2:$($env:R2_BUCKET)/apps", "E:",
            "--vfs-cache-mode", "full", "--cache-dir", $cache,
            "--links", "--dir-cache-time", "10s", "--transfers", "16",
            "--log-file", $mountLog, "--log-level", "INFO"
          )
          $up = $false
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path "E:\") { $up = $true; break }
            if ($proc.HasExited) { break }
          }
          Write-Host ("RESULT mount_up={0}" -f $up)
          if (-not $up) { Get-Content $mountLog -Tail 40 -ErrorAction SilentlyContinue | Out-Host; throw "mount failed" }

          $link = "C:\Program Files\7-Zip"
          New-Item -ItemType Junction -Path $link -Target "E:\ProgramFiles\7-Zip" -Force | Out-Null
          Write-Host ("RESULT junction_created={0}" -f (Test-Path $link))
          Write-Host ("GAUGE setup_total seconds={0:N1}" -f ((Get-Date) - $t).TotalSeconds)

      - name: "3 run app through junction"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exePath = "C:\Program Files\7-Zip\7z.exe"
          Write-Host ("RESULT exe_visible={0}" -f (Test-Path $exePath))
          $t = Get-Date
          $out = & $exePath 2>&1 | Select-Object -First 4
          Write-Host ("GAUGE cold_run seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          $ok = @($out | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0
          $out | ForEach-Object { Write-Host ("OUT " + [string]$_) }
          Write-Host ("RESULT run_ok={0}" -f $ok)

          $t = Get-Date
          $null = & $exePath 2>&1 | Select-Object -First 1
          Write-Host ("GAUGE warm_run seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)

          $tmp = Join-Path $env:RUNNER_TEMP "jt"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Content (Join-Path $tmp "a.txt") "hello"
          $t = Get-Date
          & $exePath a (Join-Path $tmp "a.zip") (Join-Path $tmp "a.txt") 2>&1 | Out-Null
          Write-Host ("GAUGE zip_op seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          Write-Host ("RESULT zip_created={0}" -f (Test-Path (Join-Path $tmp "a.zip")))

      - name: "4 unmount then remount and rebuild junction"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "rclone") -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:RCLONE_CONFIG_R2_TYPE = "s3"
          $env:RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = $env:R2_ENDPOINT
          $env:RCLONE_CONFIG_R2_REGION = "auto"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = "true"
          $link = "C:\Program Files\7-Zip"

          Write-Host "--- simulate reboot: kill mount ---"
          Get-Process rclone -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 6
          & cmd.exe /c "rmdir E:" 2>&1 | Out-Null
          Write-Host ("RESULT e_gone={0}" -f (-not (Test-Path "E:\")))
          Write-Host ("RESULT link_after_unmount={0}" -f (Test-Path $link))
          $j = Get-Item $link -Force -ErrorAction SilentlyContinue
          if ($j) { Write-Host ("RESULT link_state_after_unmount={0}" -f $j.LinkType) } else { Write-Host "RESULT link_state_after_unmount=gone" }

          Write-Host "--- remount ---"
          $cache = Join-Path $env:RUNNER_TEMP "vfscache"
          $mountLog = Join-Path $env:RUNNER_TEMP "mount2.log"
          $t = Get-Date
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -ArgumentList @(
            "mount", "r2:$($env:R2_BUCKET)/apps", "E:",
            "--vfs-cache-mode", "full", "--cache-dir", $cache,
            "--links", "--dir-cache-time", "10s", "--transfers", "16",
            "--log-file", $mountLog, "--log-level", "INFO"
          )
          $up = $false
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path "E:\") { $up = $true; break }
            if ($proc.HasExited) { break }
          }
          Write-Host ("GAUGE remount_visible seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          Write-Host ("RESULT remount_up={0}" -f $up)
          Write-Host ("RESULT link_works_again={0}" -f (Test-Path $link))

          if (-not (Test-Path $link)) {
            & cmd.exe /c "rmdir `"$link`"" 2>&1 | Out-Null
            New-Item -ItemType Junction -Path $link -Target "E:\ProgramFiles\7-Zip" -Force | Out-Null
            Write-Host ("RESULT junction_rebuilt={0}" -f (Test-Path $link))
          }

          $t = Get-Date
          $out = & "C:\Program Files\7-Zip\7z.exe" 2>&1 | Select-Object -First 3
          Write-Host ("GAUGE run_after_remount seconds={0:N2}" -f ((Get-Date) - $t).TotalSeconds)
          $ok = @($out | Where-Object { [string]$_ -like "*7-Zip*" }).Count -gt 0
          Write-Host ("RESULT run_after_remount_ok={0}" -f $ok)
          $out | ForEach-Object { Write-Host ("OUT " + [string]$_) }
          Write-Host "APPS_JUNCTION_DONE"
